name: Update Lucee Definitions

on:
  # Disabled: https://github.com/emotions-ch/lucee-nix/issues/1
  # schedule:
  #   # Run daily at 23:59 UTC
  #   - cron: '59 23 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-lucee:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure Nix cache
        uses: cachix/cachix-action@v14
        with:
          name: devenv

      - name: Update Lucee definitions
        run: |
          echo "🔄 Starting Lucee definitions update..."
          nix run .#update-lucee

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --name-only
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has-changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: update Lucee definitions

          - Updated Lucee version definitions automatically
          - Generated by scheduled workflow run on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Create summary
        run: |
          echo "## Update Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has-changes }}" == "true" ]; then
            echo "✅ Lucee definitions were updated and committed" >> $GITHUB_STEP_SUMMARY
            echo "### Changed files:" >> $GITHUB_STEP_SUMMARY
            git diff --name-only HEAD~1 | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No updates were needed - definitions are already up to date" >> $GITHUB_STEP_SUMMARY
          fi
